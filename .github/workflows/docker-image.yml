name: Build and Push Docker Image

on:
  push:
    branches: [ default ] # 当代码推送到main或master分支时触发
  pull_request:
    branches: [ default ] # 针对PR的触发可以根据需要设置

jobs:
  build-and-push:
    runs-on: ubuntu-latest # 使用GitHub提供的最新Ubuntu运行器

    steps:
      # 步骤1：检出仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 步骤2：设置Docker Buildx（用于支持多平台构建等高级特性）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 步骤3：登录到Docker Hub（或其他容器注册表，如GHCR）
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }} # 你的Docker Hub用户名
          password: ${{ secrets.DOCKERHUB_TOKEN }}    # 你的Docker Hub访问令牌（Token）

      # 步骤4：构建Docker镜像并推送到仓库
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: . # 构建上下文为当前目录
          push: true # 设置为true以自动推送
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/provisioner-localpv-image:${{ github.sha }} # 使用Git提交SHA作为标签，确保唯一性
            ${{ secrets.DOCKERHUB_USERNAME }}/provisioner-localpv-image:latest           # 同时标记为latest
          cache-from: type=gha # 使用GitHub Actions缓存加速构建
          cache-to: type=gha,mode=max
